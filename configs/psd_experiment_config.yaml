# Controlled Experiment B: PSD Configuration (L_total = L_LM + 0.1 * L_PSD)

experiment:
  name: "psd_qwen3_4b_lora"
  type: "psd"
  seed: 42
  experiment_dir: "reports/experiments/psd"

model:
  model_id: "models/qwen3_4b_hf"
  attn_implementation: "eager"
  torch_dtype: "float16"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

psd:
  enabled: true
  lambda_psd: 0.1
  # Zero-based layer indices [11, 23, 34] map to 1-based Transformer layers [12, 24, 35]
  selected_layers: [11, 23, 34]
  selected_layers_1based: [12, 24, 35]
  
  # Affinity components: R_ij = alpha * S_ij - beta * dP_norm(i,j) - gamma * dG_norm(i,j)
  alpha: 1.0       # Weight for semantic similarity S_ij
  beta: 0.5        # Weight for normalized sequential/positional distance dP_norm
  gamma: 0.5       # Weight for normalized graph topological distance dG_norm
  tau: 1.0         # Softmax temperature for P_target
  
  # Future ablation hooks (toggling components independently)
  enable_semantic: true
  enable_positional: true
  enable_graph: true

  unmapped_epsilon: 1e-4  # Prior affinity for unmapped/special tokens
  d_max_cutoff: null      # If null, dynamically set to max_graph_distance + 1

training:
  max_seq_len: 256
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 2
  logging_steps: 1
  device: "cuda"

output:
  experiment_dir: "reports/experiments/psd"
  checkpoint_dir: "reports/experiments/psd/checkpoints"
  training_log_csv: "reports/experiments/psd/training_log.csv"
  validation_log_csv: "reports/experiments/psd/validation_log.csv"
  metrics_json: "reports/experiments/psd/metrics.json"
  sample_predictions_json: "reports/experiments/psd/sample_predictions.json"
  summary_md: "reports/experiments/psd/experiment_summary.md"
